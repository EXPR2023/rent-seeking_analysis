spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:rent_seeking_analysis}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Singapore&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:rent_app}
    password: ${MYSQL_PASSWORD:rent_app_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
